<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Tugas Tim - Marsha</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 mb-6">
        <h1 class="text-2xl font-bold">Dashboard Tim Marsha</h1>
        <p class="text-indigo-100 text-sm">Kelola tugas dan progres anggota tim dengan mudah</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 w-full grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow pb-10">
        
        <!-- Kolom Kiri: Daftar Anggota Tim -->
        <section class="bg-white rounded-xl shadow-sm p-5 border border-slate-100 flex flex-col">
            <h2 class="text-lg font-semibold text-slate-700 mb-3">Daftar Anggota Tim</h2>
            <div id="statusAnggota" class="text-sm text-slate-500 italic mb-2"></div>
            <!-- Wadah tombol anggota -->
            <div id="daftarAnggota" class="flex flex-col gap-2 overflow-y-auto max-h-[500px]"></div>
        </section>

        <!-- Kolom Kanan: Detail Tugas Anggota -->
        <section class="bg-white rounded-xl shadow-sm p-5 border border-slate-100 md:col-span-2 flex flex-col">
            <div class="border-b pb-4 mb-4">
                <h2 id="judulTugasHeader" class="text-xl font-bold text-slate-700">Pilih Anggota Terlebih Dahulu</h2>
                <p id="ringkasanProgres" class="text-sm text-slate-500 mt-1">-</p>
            </div>

            <!-- Status Loading & Error Tugas -->
            <div id="statusTugas" class="text-sm text-slate-500 italic mb-3"></div>

            <!-- Fitur Pencarian & Form Tambah Tugas (Disembunyikan jika belum pilih anggota) -->
            <div id="panelKontrol" class="hidden flex flex-col gap-4 mb-4">
                <!-- Kotak Pencarian -->
                <div>
                    <input type="text" id="inputPencarian" placeholder="Cari berdasarkan judul tugas..." 
                           class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <!-- Form Tambah Tugas -->
                <form id="formTambahTugas" class="flex flex-col gap-2 bg-slate-50 p-3 rounded-lg border">
                    <span class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Tambah Tugas Baru</span>
                    <div class="flex gap-2">
                        <input type="text" id="inputJudulBaru" placeholder="Masukkan judul tugas baru (minimal 5 karakter)..." 
                               class="flex-grow px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
                        <button type="submit" id="tombolSimpan" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                            Simpan
                        </button>
                    </div>
                    <!-- Pesan Error / Notifikasi Form -->
                    <p id="pesanForm" class="text-xs text-red-500 mt-1"></p>
                    <p id="notifikasiSukses" class="text-xs text-green-600 font-medium hidden"></p>
                </form>
            </div>

            <!-- Daftar Tugas -->
            <ul id="daftarTugas" class="flex flex-col gap-3 overflow-y-auto max-h-[400px] pr-1"></ul>
        </section>

    </main>
    
    <script src="script.js"></script>
</body>
</html>
