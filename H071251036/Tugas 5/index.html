
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TeamTask - Manajemen Tugas</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg">
        <div class="mx-auto max-w-6xl px-6 py-6">
            <h1 class="text-3xl font-bold">TeamTask</h1>
            <p class="mt-2 text-indigo-100">
                Aplikasi Manajemen Tugas Anggota Tim
            </p>
        </div>
    </header>

    <!-- Konten utama -->
    <main class="mx-auto grid max-w-6xl gap-6 px-6 py-8 md:grid-cols-3">

        <!-- Daftar Anggota -->
        <section class="rounded-xl bg-white p-5 shadow md:col-span-1">

            <h2 class="mb-4 text-xl font-bold">
                Daftar Anggota
            </h2>

            <p id="loadingAnggota"
               class="mb-3 text-sm text-indigo-600">
                Memuat anggota...
            </p>

            <p id="errorAnggota"
               class="mb-3 text-sm text-red-600"></p>

            <div id="daftarAnggota"
                 class="flex flex-col gap-2">
            </div>

        </section>

        <!-- Daftar Tugas -->
        <section class="rounded-xl bg-white p-5 shadow md:col-span-2">

            <h2 id="judulTugas"
                class="mb-2 text-2xl font-bold">
                Pilih Anggota
            </h2>

            <p id="progresTugas"
               class="mb-5 text-sm text-slate-500">
                Pilih anggota untuk melihat tugasnya.
            </p>

            <!-- Pencarian -->
            <div class="mb-5">

                <label for="cariTugas"
                       class="mb-2 block font-medium">
                    Cari Tugas
                </label>

                <input
                    type="text"
                    id="cariTugas"
                    placeholder="Masukkan judul tugas..."
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                >

            </div>

            <!-- Status loading dan error -->
            <p id="loadingTugas"
               class="mb-3 text-sm text-indigo-600"></p>

            <p id="errorTugas"
               class="mb-3 text-sm text-red-600"></p>

            <p id="tidakAdaTugas"
               class="mb-3 hidden text-sm text-slate-500">
                Tidak ada tugas yang cocok.
            </p>

            <!-- Daftar tugas -->
            <div id="daftarTugas"
                 class="flex flex-col gap-3">
            </div>

            <!-- Form tambah tugas -->
            <div class="mt-8 border-t border-slate-200 pt-6">

                <h3 class="mb-4 text-lg font-bold">
                    Tambah Tugas Baru
                </h3>

                <form id="formTugas"
                      class="flex flex-col gap-3 sm:flex-row">

                    <input
                        type="text"
                        id="judulBaru"
                        placeholder="Masukkan judul tugas baru..."
                        class="min-w-0 flex-1 rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                    >

                    <button
                        type="submit"
                        id="tombolSimpan"
                        class="rounded-lg bg-indigo-600 px-6 py-3 font-semibold text-white transition hover:bg-indigo-700"
                    >
                        Simpan
                    </button>

                </form>

                <p id="errorForm"
                   class="mt-3 text-sm text-red-600"></p>

                <p id="notifikasi"
                   class="mt-3 hidden rounded-lg bg-green-100 p-3 text-sm text-green-700">
                </p>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="py-5 text-center text-sm text-slate-500">
        Praktikum Pemrograman Web — BAB 5
    </footer>

    <!-- JavaScript -->
    <script src="app.js"></script>

</body>
</html>
