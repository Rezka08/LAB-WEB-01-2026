<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIM MARSHA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
</head>
<body class="min-h-screen bg-green-100 text-stone-800 antialiased">
    <main class="mx-auto max-w-5xl px-4 py-8 sm:px-8">
    <header class="mb-8">
        <h1 class="text-2xl font-bold tracking-tight">SELAMAT DATANG</h1>
        <h1 class="text-2xl font-bold tracking-tight">Pantau tugas tim</h1>
        <p class="mt-1 text-sm text-stone-600">Pilih nama anggota untuk melihat tugas dan progresnya.</p>
    </header>

    <div class="grid gap-6 md:grid-cols-3">
    <section class="rounded-lg border border-stone-300 bg-white p-4 md:col-span-1">
        <h2 class="mb-3 font-semibold">Anggota tim</h2>
        <p id="members-loading" class="hidden text-sm text-stone-500">Memuat anggota...</p>
        <p id="members-error" class="hidden rounded border border-red-300 bg-red-50 p-2 text-sm text-red-700"></p>
        <div id="members-list" class="flex flex-col gap-2"></div>
    </section>

    <section class="rounded-lg border border-stone-300 bg-white p-4 md:col-span-2">
        <h2 id="tasks-title" class="mb-3 text-lg font-semibold">Tugas</h2>
        <p id="tasks-placeholder" class="text-sm text-stone-500">Belum ada anggota yang dipilih.</p>
        <p id="tasks-loading" class="hidden text-sm text-stone-500">Memuat tugas...</p>
        <p id="tasks-error" class="hidden rounded border border-red-300 bg-red-50 p-2 text-sm text-red-700"></p>
        <div id="tasks-content" class="hidden">
        <p id="summary" class="mb-4 inline-block rounded bg-pink-50 px-3 py-1 text-sm font-medium text-pink-800"></p>

        <label for="search-input" class="mb-1 block text-sm font-medium">Cari tugas</label>
        <input id="search-input" type="search" placeholder="Ketik kata dari judul tugas" 
            class="mb-5 w-full rounded border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">

        <form id="task-form" class="mb-5" novalidate>
            <label for="task-input" class="mb-1 block text-sm font-medium">Tambah tugas baru</label>
            <div class="flex gap-2">
            <input id="task-input" type="text" placeholder="Judul tugas, minimal 5 karakter"
                class="min-w-0 flex-1 rounded border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
            <button id="save-btn" type="submit"
                class="rounded bg-pink-700 px-4 py-2 text-sm font-medium text-white hover:bg-pink-800 disabled:cursor-not-allowed disabled:opacity-60">Simpan</button>
            </div>
            <p id="form-error" class="mt-2 hidden text-sm text-red-700"></p>
        </form>

        <p id="empty-message" class="hidden text-sm text-stone-500">Tidak ada tugas yang cocok.</p>
        <ul id="task-list" class="flex flex-col gap-2"></ul>
        </div>
    </section>
    </div>
</main>

<div id="toast" role="status"
    class="hidden fixed bottom-6 right-6 rounded bg-stone-900 px-4 py-3 text-sm text-white shadow-lg"></div>
    
</body>
</html>
